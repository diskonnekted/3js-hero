<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>TERTIUP &mdash; daun, angin, cahaya</title>
<meta name="description" content="Animasi 3D dedaunan tertiup angin dengan aksen sinematik: backlight, god ray, grain, dan gerak kamera lambat.">
<style>
  :root {
    --bar: clamp(0px, calc((100vh - 100vw / 2.39) / 2), 9vh);
    --ink: #f3ece0;
    --ink-soft: rgba(243, 236, 224, 0.62);
    --edge-pad: clamp(18px, 4vw, 60px);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: #04060a;
    overflow: hidden;
  }

  body {
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  #stage {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: crosshair;
  }

  /* Letterbox: rasio 2.39:1, dikunci supaya di layar potret tidak menelan gambar. */
  .bars { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
  .bars::before,
  .bars::after { content: ""; position: absolute; left: 0; right: 0; height: var(--bar); background: #04060a; }
  .bars::before { top: 0; }
  .bars::after { bottom: 0; }

  .hud {
    position: fixed;
    z-index: 6;
    left: var(--edge-pad);
    bottom: calc(var(--bar) + clamp(18px, 3.4vh, 36px));
    pointer-events: none;
    text-shadow: 0 1px 12px rgba(0, 0, 0, 0.75);
  }

  .hud__kicker {
    margin: 0 0 0.7em;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .hud__title {
    margin: 0;
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: clamp(26px, 4.2vw, 52px);
    line-height: 1;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--ink);
  }

  .hud__rule {
    width: clamp(48px, 9vw, 110px);
    height: 1px;
    margin: clamp(14px, 2.2vh, 22px) 0 clamp(10px, 1.6vh, 16px);
    background: linear-gradient(90deg, rgba(255, 201, 138, 0.9), rgba(255, 201, 138, 0));
  }

  .hud__sub {
    margin: 0;
    font-size: 11px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .hint {
    position: fixed;
    z-index: 6;
    right: var(--edge-pad);
    bottom: calc(var(--bar) + clamp(18px, 3.4vh, 36px));
    margin: 0;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(243, 236, 224, 0.5);
    text-align: right;
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.8);
    pointer-events: none;
  }

  .hud__kicker,
  .hud__title,
  .hud__rule,
  .hud__sub,
  .hint { opacity: 0; }

  body.is-ready .hud__kicker { animation: rise 1.4s 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  body.is-ready .hud__title { animation: rise 1.6s 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  body.is-ready .hud__rule { animation: unfold 1.6s 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  body.is-ready .hud__sub { animation: rise 1.4s 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  body.is-ready .hint { animation: rise 1.2s 1.5s ease-out forwards; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes unfold {
    from { opacity: 0; transform: scaleX(0); transform-origin: left center; }
    to { opacity: 1; transform: scaleX(1); transform-origin: left center; }
  }

  #loader {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: grid;
    place-content: center;
    gap: 18px;
    justify-items: center;
    background: #04060a;
    transition: opacity 1.1s ease, visibility 1.1s;
  }
  #loader p {
    margin: 0;
    font-size: 10.5px;
    letter-spacing: 0.44em;
    text-transform: uppercase;
    color: rgba(243, 236, 224, 0.45);
  }
  #loader .track { width: 132px; height: 1px; background: rgba(243, 236, 224, 0.14); overflow: hidden; }
  #loader .track span {
    display: block;
    width: 40%;
    height: 100%;
    background: linear-gradient(90deg, transparent, #ffc98a, transparent);
    animation: sweep 1.35s ease-in-out infinite;
  }
  @keyframes sweep {
    from { transform: translateX(-120%); }
    to { transform: translateX(320%); }
  }
  body.is-ready #loader { opacity: 0; visibility: hidden; }

  #loader.is-error p { letter-spacing: 0.1em; text-transform: none; max-width: 34ch; text-align: center; line-height: 1.6; }
  #loader.is-error .track { display: none; }

  @media (prefers-reduced-motion: reduce) {
    body.is-ready .hud__kicker,
    body.is-ready .hud__title,
    body.is-ready .hud__rule,
    body.is-ready .hud__sub,
    body.is-ready .hint { animation-duration: 0.01s; animation-delay: 0s; }
  }
</style>
</head>
<body>
  <canvas id="stage" aria-label="Animasi 3D dedaunan yang tertiup angin"></canvas>

  <div class="bars" aria-hidden="true"></div>

  <div class="hud">
    <p class="hud__kicker">sore &middot; 18:42</p>
    <h1 class="hud__title">Tertiup</h1>
    <div class="hud__rule" aria-hidden="true"></div>
    <p class="hud__sub">daun &middot; angin &middot; cahaya</p>
  </div>

  <p class="hint">gerakkan kursor &middot; tahan klik untuk hembusan</p>

  <div id="loader" role="status">
    <p>menyiapkan kanopi</p>
    <div class="track"><span></span></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>
  <script>
  (function () {
    'use strict';

    var loader = document.getElementById('loader');
    var canvas = document.getElementById('stage');

    function fail(msg) {
      loader.classList.add('is-error');
      loader.innerHTML = '<p>' + msg + '</p>';
    }

    if (!window.THREE) {
      fail('three.js gagal dimuat. Halaman ini butuh koneksi internet sekali jalan, sambungkan lalu muat ulang.');
      return;
    }

    // ---------------------------------------------------------------- utils
    function mulberry32(seed) {
      return function () {
        seed |= 0; seed = seed + 0x6D2B79F5 | 0;
        var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    var random = mulberry32(0x5EED11);
    function rand(a, b) { return a + (b - a) * random(); }
    function randUnit(out) {
      var u = random() * 2 - 1;
      var th = random() * Math.PI * 2;
      var r = Math.sqrt(1 - u * u);
      return out.set(r * Math.cos(th), u, r * Math.sin(th));
    }

    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var motionScale = reduced ? 0.22 : 1;
    var isSmall = Math.min(window.innerWidth, window.innerHeight) < 620;
    var density = isSmall ? 0.55 : 1;

    // ------------------------------------------------------------- renderer
    var renderer;
    try {
      renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: false,
        alpha: false,
        powerPreference: 'high-performance',
        stencil: false
      });
    } catch (err) {
      fail('WebGL tidak tersedia di perangkat ini. Coba browser lain atau aktifkan akselerasi perangkat keras.');
      return;
    }

    var pixelRatio = Math.min(window.devicePixelRatio || 1, isSmall ? 1.5 : 1.75);
    renderer.setPixelRatio(pixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.outputColorSpace = THREE.LinearSRGBColorSpace; // grading manual di pass akhir
    renderer.toneMapping = THREE.NoToneMapping;

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 500);

    // -------------------------------------------------------------- sharing
    var U = {
      time: { value: 0 },
      wind: { value: 0.62 },
      windDir: { value: new THREE.Vector2(0.92, -0.39).normalize() },
      sunDir: { value: new THREE.Vector3(-0.34, 0.27, -0.90).normalize() },
      camPos: { value: new THREE.Vector3() },
      fogColor: { value: new THREE.Color(0x35362a) },
      fogDensity: { value: 0.040 },
      deep: { value: new THREE.Color(0x101d14) },
      midC: { value: new THREE.Color(0x2b5231) },
      lightC: { value: new THREE.Color(0xa9c95f) },
      backC: { value: new THREE.Color(0xe0d97c) }
    };

    // ------------------------------------------------------------- lighting
    var sunLight = new THREE.DirectionalLight(0xffc9a0, 2.1);
    sunLight.position.copy(U.sunDir.value).multiplyScalar(60);
    scene.add(sunLight);
    scene.add(new THREE.HemisphereLight(0x4a6178, 0x0b1009, 0.7));

    scene.fog = new THREE.FogExp2(U.fogColor.value.getHex(), U.fogDensity.value);

    // ------------------------------------------------------------------ sky
    var skyMat = new THREE.ShaderMaterial({
      uniforms: {
        uTop: { value: new THREE.Color(0x122c3b) },
        uHorizon: { value: new THREE.Color(0xc9915a) },
        uGround: { value: new THREE.Color(0x12130e) },
        uSunColor: { value: new THREE.Color(0xfff0d0) },
        uSunDir: U.sunDir
      },
      vertexShader: [
        'varying vec3 vDir;',
        'void main() {',
        '  vDir = position;',
        '  vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
        '  gl_Position = p.xyww;',
        '}'
      ].join('\n'),
      fragmentShader: [
        'precision highp float;',
        'varying vec3 vDir;',
        'uniform vec3 uTop, uHorizon, uGround, uSunColor, uSunDir;',
        'void main() {',
        '  vec3 dir = normalize(vDir);',
        '  float h = dir.y;',
        '  vec3 col = mix(uHorizon, uTop, pow(clamp(h, 0.0, 1.0), 0.55));',
        '  col = mix(col, uGround, smoothstep(0.02, -0.28, h));',
        '  float s = max(dot(dir, uSunDir), 0.0);',
        '  col += uSunColor * pow(s, 260.0) * 4.0;',
        '  col += uSunColor * pow(s, 16.0) * 0.55;',
        '  col += uSunColor * pow(s, 3.0) * 0.09;',
        '  gl_FragColor = vec4(col, 1.0);',
        '}'
      ].join('\n'),
      side: THREE.BackSide,
      depthWrite: false
    });

    var sky = new THREE.Mesh(new THREE.SphereGeometry(300, 32, 20), skyMat);
    sky.frustumCulled = false;
    scene.add(sky);

    // --------------------------------------------------------------- ground
    var ground = new THREE.Mesh(
      new THREE.PlaneGeometry(400, 400),
      new THREE.MeshStandardMaterial({ color: 0x18211a, roughness: 1, metalness: 0 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -3.2;
    scene.add(ground);

    // ---------------------------------------------------------------- leaves
    var LEAF_VERT = [
      'uniform float uTime;',
      'uniform float uWind;',
      'uniform vec2 uWindDir;',
      'attribute float aPhase;',
      'attribute float aTint;',
      'attribute float aFlex;',
      'attribute float aShade;',
      'varying vec2 vShape;',
      'varying vec3 vWorld;',
      'varying vec3 vNormal;',
      'varying float vTint;',
      'varying float vGust;',
      'varying float vShade;',
      'void main() {',
      '  vShape = vec2(position.x + 0.5, position.y);',
      '  vTint = aTint;',
      '  vShade = aShade;',
      '',
      '  mat4 m = modelMatrix * instanceMatrix;',
      '  vec3 anchor = (m * vec4(0.0, 0.0, 0.0, 1.0)).xyz;',
      '',
      '  float t = uTime;',
      '  float ph = aPhase * 6.28318;',
      '',
      // Gelombang angin menjalar lewat ruang, bukan per-daun: inilah yang bikin kanopi bergerak serempak.
      '  float w1 = sin(anchor.x * 0.55 + anchor.z * 0.30 - t * 1.25 + ph * 0.6);',
      '  float w2 = sin(anchor.x * 0.21 - anchor.z * 0.45 + t * 0.62 + ph * 1.7);',
      '  float w3 = sin(anchor.y * 0.75 + anchor.x * 0.10 + t * 1.90 + ph * 3.1);',
      '  float gust = clamp(0.5 + 0.5 * (w1 * 0.45 + w2 * 0.35 + w3 * 0.20), 0.0, 1.0);',
      '  gust = pow(gust, 1.6);',
      '  vGust = gust;',
      '',
      '  float flutter = sin(t * 5.7 + ph * 4.0) * 0.65 + sin(t * 9.3 + ph * 7.0) * 0.35;',
      '',
      // Tuas: pangkal daun menempel, ujungnya paling banyak bergerak.
      // Skala instance dipakai supaya daun besar dan kecil bergerak sepadan, bukan sama mutlak.
      '  float scl = length(m[1].xyz);',
      '  float lever = clamp(position.y, 0.0, 1.0);',
      '  float amp = uWind * aFlex * (0.06 + 0.40 * gust) * lever * lever * scl;',
      '',
      '  vec3 off = vec3(uWindDir.x, 0.0, uWindDir.y) * amp;',
      '  off += vec3(-uWindDir.y, 0.0, uWindDir.x) * (amp * 0.6 * flutter);',
      '  off.y -= abs(amp) * 0.45 * abs(flutter);',
      '',
      '  vec3 p = position;',
      '  p.z -= position.x * position.x * 0.45;',
      '',
      '  float twist = (0.45 * gust + 0.30 * flutter) * uWind * aFlex * lever * 0.8;',
      '  float ct = cos(twist);',
      '  float st = sin(twist);',
      '  p.xz = vec2(ct * p.x - st * p.z, st * p.x + ct * p.z);',
      '',
      '  float bend = (0.30 * gust + 0.18 * flutter) * uWind * aFlex * lever * 0.55;',
      '  p.z += lever * lever * bend;',
      '',
      '  vec4 world = m * vec4(p, 1.0);',
      '  world.xyz += off;',
      '',
      '  vec3 n = normalize(mat3(m) * vec3(0.0, 0.0, 1.0));',
      '  float cn = cos(twist * 0.8);',
      '  float sn = sin(twist * 0.8);',
      '  n.xz = vec2(cn * n.x - sn * n.z, sn * n.x + cn * n.z);',
      '',
      '  vWorld = world.xyz;',
      '  vNormal = normalize(n);',
      '  gl_Position = projectionMatrix * viewMatrix * world;',
      '}'
    ].join('\n');

    var LEAF_FRAG = [
      'precision highp float;',
      'uniform vec3 uSunDir, uCamPos, uFogColor;',
      'uniform vec3 uDeep, uMidC, uLightC, uBackC;',
      'uniform float uFogDensity;',
      'varying vec2 vShape;',
      'varying vec3 vWorld;',
      'varying vec3 vNormal;',
      'varying float vTint;',
      'varying float vGust;',
      'varying float vShade;',
      '',
      'float halfWidth(float v) {',
      '  float k = sin(3.14159265 * pow(v, 0.82));',
      '  return 0.5 * pow(max(k, 0.0), 0.62) * (0.92 + 0.08 * sin(v * 26.0));',
      '}',
      '',
      'void main() {',
      '  float v = clamp(vShape.y, 0.0, 1.0);',
      '  float hw = halfWidth(v);',
      '  float d = abs(vShape.x - 0.5) - hw;',
      '  float aa = fwidth(d) * 1.1;',
      '  float alpha = 1.0 - smoothstep(-aa, aa, d);',
      '  if (alpha < 0.45) discard;',
      '',
      '  float xn = clamp((vShape.x - 0.5) / max(hw, 1e-3), -1.0, 1.0);',
      '  float midrib = smoothstep(0.16, 0.0, abs(xn));',
      '  float veins = smoothstep(0.72, 0.95, abs(sin(v * 22.0 - abs(xn) * 3.0)));',
      '',
      '  vec3 N = normalize(vNormal);',
      '  if (!gl_FrontFacing) N = -N;',
      '  vec3 V = normalize(uCamPos - vWorld);',
      '  float ndl = dot(N, uSunDir);',
      '',
      // Daun itu tipis: satu sisi kena matahari langsung, sisi lain meneruskannya.
      '  float lit = clamp(ndl, 0.0, 1.0);',
      '  float backSide = clamp(-ndl, 0.0, 1.0);',
      '  float sunAhead = pow(clamp(dot(-V, uSunDir) * 0.5 + 0.5, 0.0, 1.0), 4.5);',
      '  float trans = backSide * sunAhead;',
      '',
      // Isi langit: dingin dari atas, hangat dari pantulan bawah.
      '  vec3 ambient = mix(vec3(0.006, 0.008, 0.008), vec3(0.012, 0.020, 0.028), clamp(N.y * 0.5 + 0.5, 0.0, 1.0));',
      '',
      '  vec3 col = uDeep + ambient;',
      '  col += uMidC * (0.25 + 0.75 * lit);',
      '  col += uLightC * pow(lit, 1.6) * 1.05;',
      '  col += uBackC * trans * 0.45 * (0.7 + 0.6 * vTint);',
      '  col *= 0.86 + 0.28 * vTint;',
      '  col *= 0.94 + 0.12 * vGust;',
      '',
      '  col *= 1.0 - 0.22 * veins;',
      '  col += uLightC * 0.14 * midrib * lit;',
      '',
      '  float rim = pow(1.0 - abs(dot(N, V)), 3.0) * backSide;',
      '  col += uBackC * rim * 0.18;',
      '',
      '  col *= mix(0.34, 1.0, vShade);',
      '',
      '  float dist = distance(uCamPos, vWorld);',
      '  float fog = 1.0 - exp(-uFogDensity * uFogDensity * dist * dist);',
      '  col = mix(col, uFogColor, clamp(fog, 0.0, 1.0));',
      '',
      '  gl_FragColor = vec4(col, alpha);',
      '}'
    ].join('\n');

    var leafMat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: U.time,
        uWind: U.wind,
        uWindDir: U.windDir,
        uSunDir: U.sunDir,
        uCamPos: U.camPos,
        uFogColor: U.fogColor,
        uFogDensity: U.fogDensity,
        uDeep: U.deep,
        uMidC: U.midC,
        uLightC: U.lightC,
        uBackC: U.backC
      },
      vertexShader: LEAF_VERT,
      fragmentShader: LEAF_FRAG,
      side: THREE.DoubleSide,
      transparent: true,
      depthWrite: true,
      blending: THREE.NormalBlending
    });

    // ---- pembuat daun ----
    var _n = new THREE.Vector3();
    var _tip = new THREE.Vector3();
    var _side = new THREE.Vector3();
    var _basis = new THREE.Matrix4();
    var _pos = new THREE.Vector3();
    var _quat = new THREE.Quaternion();
    var _scale = new THREE.Vector3();
    var _mtx = new THREE.Matrix4();

    var leaves = [];

    // Arah ujung daun diambil dari garis singgung paling "menggantung" di sekitar normal,
    // lalu diputar acak supaya tidak seragam.
    function addLeaf(px, py, pz, nx, ny, nz, size, hangDir, spread, tint) {
      var n = _n.set(nx, ny, nz);
      if (n.lengthSq() < 1e-6) n.set(0, 1, 0);
      n.normalize();

      _tip.set(0, hangDir, 0);
      _tip.addScaledVector(n, -_tip.dot(n));
      if (_tip.lengthSq() < 1e-4) {
        _tip.set(1, 0, 0).addScaledVector(n, -n.x);
        if (_tip.lengthSq() < 1e-4) _tip.set(0, 0, 1).addScaledVector(n, -n.z);
      }
      _tip.normalize();
      _tip.applyAxisAngle(n, (random() * 2 - 1) * spread);
      _tip.addScaledVector(n, -_tip.dot(n)).normalize();

      _side.crossVectors(_tip, n).normalize();
      _basis.makeBasis(_side, _tip, n);
      _quat.setFromRotationMatrix(_basis);

      _pos.set(px, py, pz);
      _scale.set(size, size, size);
      _mtx.compose(_pos, _quat, _scale);
      leaves.push({ m: _mtx.clone(), px: px, py: py, pz: pz, tint: tint, phase: random(), flex: rand(0.7, 1.35) });
    }

    function addCluster(cfg) {
      var c = cfg.center;
      var r = cfg.radii;
      var count = Math.max(1, Math.round(cfg.count * density));
      var dir = new THREE.Vector3();

      for (var i = 0; i < count; i++) {
        randUnit(dir);
        var k = Math.pow(random(), 0.42); // condong ke kulit, bukan inti: lebih padat dilihat dari luar
        var px = c.x + dir.x * r.x * k;
        var py = c.y + dir.y * r.y * k;
        var pz = c.z + dir.z * r.z * k;

        var nx = dir.x / r.x + rand(-0.55, 0.55);
        var ny = dir.y / r.y + rand(-0.55, 0.55) + (cfg.normalUp || 0);
        var nz = dir.z / r.z + rand(-0.55, 0.55);

        addLeaf(
          px, py, pz, nx, ny, nz,
          rand(cfg.size[0], cfg.size[1]),
          cfg.hangDir === undefined ? -1 : cfg.hangDir,
          cfg.spread === undefined ? 2.3 : cfg.spread,
          Math.min(1, Math.max(0, cfg.tint + rand(-0.22, 0.22)))
        );
      }
    }

    // ---- cabang utama: garis diagonal dari kiri-atas, tempat kanopi tumbuh ----
    var branchCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-5.2, 4.15, -1.2),
      new THREE.Vector3(-2.9, 3.45, -1.8),
      new THREE.Vector3(-0.7, 2.85, -2.1),
      new THREE.Vector3(1.5, 2.25, -2.4),
      new THREE.Vector3(3.8, 1.6, -2.7)
    ]);

    var barkMat = new THREE.MeshStandardMaterial({ color: 0x171208, roughness: 0.95, metalness: 0 });

    var trunk = new THREE.Mesh(new THREE.TubeGeometry(branchCurve, 40, 0.075, 6, false), barkMat);
    scene.add(trunk);

    for (var b = 0; b < 5; b++) {
      var t0 = 0.18 + b * 0.16;
      var origin = branchCurve.getPoint(t0);
      var hang = rand(0.9, 1.9);
      var sub = new THREE.CatmullRomCurve3([
        origin.clone(),
        origin.clone().add(new THREE.Vector3(rand(-0.9, 0.9), -hang * 0.55, rand(-0.6, 0.6))),
        origin.clone().add(new THREE.Vector3(rand(-1.6, 1.6), -hang, rand(-1.0, 1.0)))
      ]);
      scene.add(new THREE.Mesh(new THREE.TubeGeometry(sub, 16, 0.032, 5, false), barkMat));
    }

    // ---- kanopi utama: gugus daun menyusuri cabang ----
    // Sengaja jarang: tiap daun harus terbaca, bukan menjadi mosaik keruh.
    for (var s = 0; s <= 9; s++) {
      var p = branchCurve.getPoint(s / 9);
      addCluster({
        center: new THREE.Vector3(p.x + rand(-0.3, 0.3), p.y + rand(-0.6, 0.12), p.z + rand(-0.25, 0.45)),
        radii: new THREE.Vector3(rand(0.75, 1.05), rand(0.7, 0.95), rand(0.6, 0.85)),
        count: 55,
        size: [0.26, 0.52],
        tint: 0.55
      });
    }

    // ---- massa kanopi di kanan & kiri, pengisi bingkai ----
    addCluster({
      center: new THREE.Vector3(3.6, 1.5, -3.6), radii: new THREE.Vector3(1.9, 1.5, 1.4),
      count: 110, size: [0.26, 0.54], tint: 0.44
    });
    addCluster({
      center: new THREE.Vector3(-4.2, 1.2, -4.0), radii: new THREE.Vector3(1.8, 1.5, 1.5),
      count: 95, size: [0.26, 0.52], tint: 0.30
    });
    addCluster({
      center: new THREE.Vector3(-0.4, 3.9, -3.0), radii: new THREE.Vector3(3.6, 1.1, 1.2),
      count: 120, size: [0.24, 0.50], tint: 0.48
    });

    // ---- vegetasi bawah: siluet gelap untuk menahan bingkai ----
    for (var g = 0; g < 6; g++) {
      addCluster({
        center: new THREE.Vector3(rand(-7, 7), rand(-2.0, -0.6), rand(-9, -1.5)),
        radii: new THREE.Vector3(rand(0.9, 1.7), rand(0.5, 0.9), rand(0.7, 1.2)),
        count: 40, size: [0.38, 0.85], tint: 0.16, hangDir: 1, spread: 1.8, normalUp: 0.4
      });
    }

    // ---- dahan depan: bingkai gelap di sudut bawah, seperti menembak dari balik semak ----
    // Posisi dihitung agar jatuh tepat di tepi frustum pada z = 1.2 (4,8 unit dari kamera).
    addCluster({
      center: new THREE.Vector3(1.45, 0.5, 1.2), radii: new THREE.Vector3(0.75, 0.5, 0.5),
      count: 36, size: [0.28, 0.52], tint: 0.12, hangDir: 1, spread: 2.0, normalUp: 0.5
    });
    addCluster({
      center: new THREE.Vector3(-1.75, 0.42, 1.5), radii: new THREE.Vector3(0.65, 0.45, 0.45),
      count: 26, size: [0.26, 0.48], tint: 0.10, hangDir: 1, spread: 2.0, normalUp: 0.4
    });

    // ---- kanopi jauh: lapisan kabut ----
    addCluster({
      center: new THREE.Vector3(-1.0, 2.2, -13.0), radii: new THREE.Vector3(9.0, 3.4, 2.6),
      count: 200, size: [0.55, 1.25], tint: 0.35
    });
    addCluster({
      center: new THREE.Vector3(9.0, 3.0, -16.0), radii: new THREE.Vector3(6.0, 3.0, 3.0),
      count: 130, size: [0.6, 1.3], tint: 0.28
    });

    // ---- jadikan satu InstancedMesh: satu draw call ----
    var leafGeo = new THREE.PlaneGeometry(1, 1, 2, 4);
    leafGeo.translate(0, 0.5, 0);

    var N = leaves.length;

    // Proksi oklusi: hitung kerapatan tetangga tiap daun. Daun dalam massa jadi gelap,
    // daun di permukaan tetap terang, inilah yang memberi kanopi bentuk, bukan rata.
    var aShade = new Float32Array(N);
    (function computeShade() {
      var CELL = 0.38;
      var buckets = new Map();
      var i, ax, ay, az;

      for (i = 0; i < N; i++) {
        var L = leaves[i];
        var key = Math.floor(L.px / CELL) + ':' + Math.floor(L.py / CELL) + ':' + Math.floor(L.pz / CELL);
        var list = buckets.get(key);
        if (list === undefined) { list = []; buckets.set(key, list); }
        list.push(i);
      }

      var counts = new Float32Array(N);
      var sorted = [];
      var r2 = CELL * CELL;

      for (i = 0; i < N; i++) {
        var A = leaves[i];
        var ix = Math.floor(A.px / CELL);
        var iy = Math.floor(A.py / CELL);
        var iz = Math.floor(A.pz / CELL);
        var c = 0;

        for (ax = -1; ax <= 1; ax++) {
          for (ay = -1; ay <= 1; ay++) {
            for (az = -1; az <= 1; az++) {
              var near = buckets.get((ix + ax) + ':' + (iy + ay) + ':' + (iz + az));
              if (near === undefined) continue;
              for (var j = 0; j < near.length; j++) {
                var B = leaves[near[j]];
                var dx = B.px - A.px, dy = B.py - A.py, dz = B.pz - A.pz;
                if (dx * dx + dy * dy + dz * dz < r2) c++;
              }
            }
          }
        }
        counts[i] = c;
        sorted.push(c);
      }

      sorted.sort(function (x, y) { return x - y; });
      var lo = sorted[Math.floor(N * 0.1)] || 1;
      var hi = sorted[Math.floor(N * 0.9)] || (lo + 1);
      if (hi - lo < 2) hi = lo + 2;

      for (i = 0; i < N; i++) {
        var t = (hi - counts[i]) / (hi - lo);
        t = t < 0 ? 0 : (t > 1 ? 1 : t);
        aShade[i] = 0.45 + 0.55 * Math.pow(t, 0.75);
      }
      buckets = null;
    })();

    var aPhase = new Float32Array(N);
    var aTint = new Float32Array(N);
    var aFlex = new Float32Array(N);

    var leafMesh = new THREE.InstancedMesh(leafGeo, leafMat, N);
    for (var li = 0; li < N; li++) {
      leafMesh.setMatrixAt(li, leaves[li].m);
      aPhase[li] = leaves[li].phase;
      aTint[li] = leaves[li].tint;
      aFlex[li] = leaves[li].flex;
    }
    leafGeo.setAttribute('aPhase', new THREE.InstancedBufferAttribute(aPhase, 1));
    leafGeo.setAttribute('aTint', new THREE.InstancedBufferAttribute(aTint, 1));
    leafGeo.setAttribute('aFlex', new THREE.InstancedBufferAttribute(aFlex, 1));
    leafGeo.setAttribute('aShade', new THREE.InstancedBufferAttribute(aShade, 1));
    leafMesh.instanceMatrix.needsUpdate = true;
    leafMesh.frustumCulled = false;
    scene.add(leafMesh);
    leaves = null;

    // -------------------------------------------------------- berkas cahaya
    var shaftMat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: U.time,
        uColor: { value: new THREE.Color(0xffd7a0) },
        uOpacity: { value: 0.10 }
      },
      vertexShader: [
        'varying vec2 vUv;',
        'void main() {',
        '  vUv = uv;',
        '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
        '}'
      ].join('\n'),
      fragmentShader: [
        'precision highp float;',
        'varying vec2 vUv;',
        'uniform float uTime;',
        'uniform vec3 uColor;',
        'uniform float uOpacity;',
        'float hash21(vec2 p) {',
        '  p = fract(p * vec2(123.34, 456.21));',
        '  p += dot(p, p + 45.32);',
        '  return fract(p.x * p.y);',
        '}',
        'float noise(vec2 p) {',
        '  vec2 i = floor(p);',
        '  vec2 f = fract(p);',
        '  f = f * f * (3.0 - 2.0 * f);',
        '  float a = hash21(i);',
        '  float b = hash21(i + vec2(1.0, 0.0));',
        '  float c = hash21(i + vec2(0.0, 1.0));',
        '  float d = hash21(i + vec2(1.0, 1.0));',
        '  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);',
        '}',
        'void main() {',
        '  float across = pow(smoothstep(0.5, 0.0, abs(vUv.x - 0.5) * 2.0), 2.2);',
        '  float along = smoothstep(0.0, 0.3, vUv.y) * smoothstep(1.0, 0.5, vUv.y);',
        '  float streak = 0.55 + 0.45 * noise(vec2(vUv.x * 7.0, vUv.y * 1.6 - uTime * 0.12));',
        '  float a = across * along * streak * uOpacity;',
        '  gl_FragColor = vec4(uColor * a, a);',
        '}'
      ].join('\n'),
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      side: THREE.DoubleSide
    });

    var shafts = new THREE.Group();
    var shaftAxis = U.sunDir.value.clone().negate();
    var camDir = new THREE.Vector3(0, 0, -1);
    var shaftSide = new THREE.Vector3().crossVectors(camDir, shaftAxis).normalize();
    var shaftNormal = new THREE.Vector3().crossVectors(shaftSide, shaftAxis).normalize();
    var shaftBasis = new THREE.Matrix4().makeBasis(shaftSide, shaftAxis, shaftNormal);
    var shaftQuat = new THREE.Quaternion().setFromRotationMatrix(shaftBasis);

    for (var sh = 0; sh < 6; sh++) {
      var mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), shaftMat.clone());
      mesh.material.uniforms.uTime = U.time;
      mesh.material.uniforms.uOpacity.value = rand(0.018, 0.055);
      mesh.quaternion.copy(shaftQuat);
      mesh.position.set(rand(-4.5, 1.5), rand(-0.5, 2.5), rand(-11, -5));
      mesh.scale.set(rand(0.7, 2.4), rand(11, 20), 1);
      mesh.renderOrder = 2;
      shafts.add(mesh);
    }
    scene.add(shafts);

    // ------------------------------------------------------------- serbuk
    var MOTES = Math.round(520 * density);
    var moteGeo = new THREE.BufferGeometry();
    var motePos = new Float32Array(MOTES * 3);
    var motePhase = new Float32Array(MOTES);
    var moteSize = new Float32Array(MOTES);

    for (var mi = 0; mi < MOTES; mi++) {
      motePos[mi * 3] = rand(-9, 9);
      motePos[mi * 3 + 1] = rand(-1.5, 5.5);
      motePos[mi * 3 + 2] = rand(-16, 1);
      motePhase[mi] = random();
      moteSize[mi] = rand(0.6, 2.4);
    }

    moteGeo.setAttribute('position', new THREE.BufferAttribute(motePos, 3));
    moteGeo.setAttribute('aPhase', new THREE.BufferAttribute(motePhase, 1));
    moteGeo.setAttribute('aSize', new THREE.BufferAttribute(moteSize, 1));

    var moteMat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: U.time,
        uWindDir: U.windDir,
        uColor: { value: new THREE.Color(0xffe6c0) }
      },
      vertexShader: [
        'uniform float uTime;',
        'uniform vec2 uWindDir;',
        'attribute float aPhase;',
        'attribute float aSize;',
        'varying float vFade;',
        'void main() {',
        '  float ph = aPhase * 6.28318;',
        '  vec3 p = position;',
        '  p.x += sin(uTime * 0.31 + ph) * 0.9;',
        '  p.xz += uWindDir * sin(uTime * 0.33 + ph) * 0.55;',
        '  p.y += sin(uTime * 0.47 + ph * 2.0) * 0.55 + cos(uTime * 0.23 + ph) * 0.3;',
        '  p.z += cos(uTime * 0.27 + ph * 1.5) * 0.7;',
        '  vec4 mv = modelViewMatrix * vec4(p, 1.0);',
        '  gl_Position = projectionMatrix * mv;',
        '  gl_PointSize = min(aSize * (48.0 / max(-mv.z, 2.0)), 15.0);',
        '  vFade = smoothstep(3.0, 7.0, -mv.z) * smoothstep(26.0, 12.0, -mv.z);',
        '}'
      ].join('\n'),
      fragmentShader: [
        'precision highp float;',
        'varying float vFade;',
        'uniform vec3 uColor;',
        'void main() {',
        '  float d = length(gl_PointCoord - 0.5);',
        '  float a = smoothstep(0.5, 0.05, d) * vFade * 0.55;',
        '  gl_FragColor = vec4(uColor * a, a);',
        '}'
      ].join('\n'),
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    var motes = new THREE.Points(moteGeo, moteMat);
    motes.frustumCulled = false;
    scene.add(motes);

    // --------------------------------------------------------- post-process
    var fsScene = new THREE.Scene();
    var fsCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    var fsQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), null);
    fsQuad.frustumCulled = false;
    fsScene.add(fsQuad);

    var FS_VERT = [
      'varying vec2 vUv;',
      'void main() {',
      '  vUv = uv;',
      '  gl_Position = vec4(position.xy, 0.0, 1.0);',
      '}'
    ].join('\n');

    function fullScreenMaterial(fragmentShader, uniforms) {
      return new THREE.ShaderMaterial({
        uniforms: uniforms,
        vertexShader: FS_VERT,
        fragmentShader: fragmentShader,
        depthTest: false,
        depthWrite: false
      });
    }

    var brightMat = fullScreenMaterial([
      'precision highp float;',
      'varying vec2 vUv;',
      'uniform sampler2D tSrc;',
      'uniform float uThreshold;',
      'void main() {',
      '  vec3 c = texture2D(tSrc, vUv).rgb;',
      '  float b = max(c.r, max(c.g, c.b));',
      '  float w = smoothstep(uThreshold, uThreshold + 0.55, b);',
      '  gl_FragColor = vec4(c * w, 1.0);',
      '}'
    ].join('\n'), {
      tSrc: { value: null },
      uThreshold: { value: 0.72 }
    });

    var blurMat = fullScreenMaterial([
      'precision highp float;',
      'varying vec2 vUv;',
      'uniform sampler2D tSrc;',
      'uniform vec2 uDir;',
      'void main() {',
      '  vec3 s = texture2D(tSrc, vUv).rgb * 0.227027;',
      '  s += (texture2D(tSrc, vUv + uDir * 1.3846).rgb + texture2D(tSrc, vUv - uDir * 1.3846).rgb) * 0.3162162;',
      '  s += (texture2D(tSrc, vUv + uDir * 3.2308).rgb + texture2D(tSrc, vUv - uDir * 3.2308).rgb) * 0.0702703;',
      '  gl_FragColor = vec4(s, 1.0);',
      '}'
    ].join('\n'), {
      tSrc: { value: null },
      uDir: { value: new THREE.Vector2() }
    });

    var compositeMat = fullScreenMaterial([
      'precision highp float;',
      'varying vec2 vUv;',
      'uniform sampler2D tScene;',
      'uniform sampler2D tBloom;',
      'uniform vec2 uRes;',
      'uniform float uTime;',
      'uniform float uExposure;',
      'uniform float uBloomStrength;',
      'uniform float uGrain;',
      '',
      'vec3 aces(vec3 x) {',
      '  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);',
      '}',
      'float hash(vec2 p) {',
      '  return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);',
      '}',
      '',
      'void main() {',
      '  vec2 uv = vUv;',
      '  vec2 d = uv - 0.5;',
      '  float r2 = dot(d, d);',
      // Aberasi kromatik hanya terasa di tepi bingkai, seperti lensa sinema.
      '  vec2 ca = d * (r2 * 0.008);',
      '  vec3 col;',
      '  col.r = texture2D(tScene, uv + ca).r;',
      '  col.g = texture2D(tScene, uv).g;',
      '  col.b = texture2D(tScene, uv - ca).b;',
      '',
      '  col += texture2D(tBloom, uv).rgb * uBloomStrength;',
      '  col *= uExposure;',
      '  col = aces(col);',
      '',
      '  float luma = dot(col, vec3(0.2126, 0.7152, 0.0722));',
      '  col = mix(vec3(luma), col, 1.02);',
      '  col = mix(col * vec3(0.94, 1.02, 1.07), col * vec3(1.07, 1.0, 0.92), smoothstep(0.18, 0.85, luma));',
      '  col = mix(col, col * col * (3.0 - 2.0 * col), 0.22);',
      '',
      '  float vig = smoothstep(1.0, 0.2, length(d) * 1.32);',
      '  col *= mix(0.42, 1.0, vig);',
      '',
      '  float g = hash(uv * uRes + fract(uTime) * 137.0) - 0.5;',
      '  col += g * uGrain * (0.55 + 0.45 * (1.0 - luma));',
      '  col = max(col, 0.0);',
      '',
      '  col = mix(col * 12.92, 1.055 * pow(col, vec3(1.0 / 2.4)) - 0.055, step(vec3(0.0031308), col));',
      '  gl_FragColor = vec4(col, 1.0);',
      '}'
    ].join('\n'), {
      tScene: { value: null },
      tBloom: { value: null },
      uRes: { value: new THREE.Vector2(1, 1) },
      uTime: { value: 0 },
      uExposure: { value: 0.95 },
      uBloomStrength: { value: 0.85 },
      uGrain: { value: 0.042 }
    });

    var maxSamples = renderer.capabilities.isWebGL2 ? 4 : 0;
    var sceneRT = null;
    var bloomA = null;
    var bloomB = null;

    function makeTargets() {
      var size = new THREE.Vector2();
      renderer.getDrawingBufferSize(size);
      var bw = Math.max(2, Math.floor(size.x));
      var bh = Math.max(2, Math.floor(size.y));
      var qw = Math.max(1, Math.floor(bw / 4));
      var qh = Math.max(1, Math.floor(bh / 4));

      if (sceneRT) { sceneRT.dispose(); bloomA.dispose(); bloomB.dispose(); }

      sceneRT = new THREE.WebGLRenderTarget(bw, bh, {
        type: THREE.HalfFloatType,
        samples: maxSamples,
        depthBuffer: true,
        minFilter: THREE.LinearFilter,
        magFilter: THREE.LinearFilter
      });

      bloomA = new THREE.WebGLRenderTarget(qw, qh, {
        type: THREE.HalfFloatType,
        depthBuffer: false,
        minFilter: THREE.LinearFilter,
        magFilter: THREE.LinearFilter
      });

      bloomB = new THREE.WebGLRenderTarget(qw, qh, {
        type: THREE.HalfFloatType,
        depthBuffer: false,
        minFilter: THREE.LinearFilter,
        magFilter: THREE.LinearFilter
      });

      compositeMat.uniforms.uRes.value.set(bw, bh);
    }

    makeTargets();

    function blit(material, target) {
      fsQuad.material = material;
      renderer.setRenderTarget(target);
      renderer.clear(true, true, false);
      renderer.render(fsScene, fsCam);
    }

    function renderBloom() {
      brightMat.uniforms.tSrc.value = sceneRT.texture;
      blit(brightMat, bloomA);

      var w = bloomA.width;
      var h = bloomA.height;

      blurMat.uniforms.tSrc.value = bloomA.texture;
      blurMat.uniforms.uDir.value.set(1 / w, 0);
      blit(blurMat, bloomB);

      blurMat.uniforms.tSrc.value = bloomB.texture;
      blurMat.uniforms.uDir.value.set(0, 1 / h);
      blit(blurMat, bloomA);

      blurMat.uniforms.tSrc.value = bloomA.texture;
      blurMat.uniforms.uDir.value.set(2.4 / w, 0);
      blit(blurMat, bloomB);

      blurMat.uniforms.tSrc.value = bloomB.texture;
      blurMat.uniforms.uDir.value.set(0, 2.4 / h);
      blit(blurMat, bloomA);
    }

    // ---------------------------------------------------------- interaksi
    var pointerTarget = new THREE.Vector2();
    var pointer = new THREE.Vector2();
    var pressed = false;
    var pressure = 0;

    function setPointer(x, y) {
      pointerTarget.set(
        (x / window.innerWidth) * 2 - 1,
        -((y / window.innerHeight) * 2 - 1)
      );
    }

    window.addEventListener('pointermove', function (e) {
      setPointer(e.clientX, e.clientY);
    }, { passive: true });

    window.addEventListener('pointerdown', function (e) {
      pressed = true;
      setPointer(e.clientX, e.clientY);
    });

    window.addEventListener('pointerup', function () { pressed = false; });
    window.addEventListener('pointercancel', function () { pressed = false; });
    window.addEventListener('blur', function () { pressed = false; });

    window.addEventListener('resize', function () {
      var w = window.innerWidth;
      var h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
      makeTargets();
    });

    // ------------------------------------------------------------- animasi
    var clock = new THREE.Clock();
    var elapsed = 0;
    var lookAt = new THREE.Vector3();

    var camBaseX = 0.0;
    var camBaseY = 1.2;
    var camBaseZ = 6.0;

    var frames = 0;
    var slowWindow = 0;
    var degraded = false;

    function animate() {
      requestAnimationFrame(animate);

      var dt = Math.min(clock.getDelta(), 0.05);
      elapsed += dt;

      // Angin: dasar tenang + ayunan panjang + hembusan saat ditahan.
      pressure += ((pressed ? 1 : 0) - pressure) * Math.min(1, dt * 3.2);
      var gustWave = 0.5 + 0.5 * Math.sin(elapsed * 0.27) * Math.sin(elapsed * 0.093 + 1.1);
      var windNow = 0.58 + 0.32 * gustWave * gustWave + 0.85 * pressure;
      U.wind.value += (windNow - U.wind.value) * Math.min(1, dt * 3.0);
      U.time.value = elapsed;

      pointer.lerp(pointerTarget, Math.min(1, dt * 2.2));

      // Kamera: dolly pelan + goyangan tangan operator.
      var driftX = (Math.sin(elapsed * 0.11) * 0.55 + Math.sin(elapsed * 0.047 + 1.7) * 0.42) * motionScale;
      var driftY = (Math.sin(elapsed * 0.13 + 0.7) * 0.26 + Math.sin(elapsed * 0.058) * 0.14) * motionScale;
      var driftZ = Math.sin(elapsed * 0.075) * 0.9 * motionScale;

      camera.position.set(
        camBaseX + driftX + pointer.x * 0.6,
        camBaseY + driftY + pointer.y * 0.32,
        camBaseZ + driftZ
      );
      camera.position.x += (Math.sin(elapsed * 2.3) * 0.006 + Math.sin(elapsed * 0.9 + 2.0) * 0.005) * motionScale;
      camera.position.y += (Math.sin(elapsed * 2.7 + 1.1) * 0.005) * motionScale;

      lookAt.set(
        -0.1 + pointer.x * 0.25 + Math.sin(elapsed * 0.08) * 0.15 * motionScale,
        1.45 + pointer.y * 0.2 + Math.sin(elapsed * 0.1 + 0.6) * 0.08 * motionScale,
        -2.4
      );
      camera.lookAt(lookAt);
      camera.rotation.z += Math.sin(elapsed * 0.21) * 0.006 * motionScale;

      U.camPos.value.copy(camera.position);

      shafts.rotation.y = Math.sin(elapsed * 0.02) * 0.02 * motionScale;

      renderer.setRenderTarget(sceneRT);
      renderer.clear(true, true, true);
      renderer.render(scene, camera);

      renderBloom();

      compositeMat.uniforms.tScene.value = sceneRT.texture;
      compositeMat.uniforms.tBloom.value = bloomA.texture;
      compositeMat.uniforms.uTime.value = elapsed;

      renderer.setRenderTarget(null);
      fsQuad.material = compositeMat;
      renderer.render(fsScene, fsCam);

      // Turunkan resolusi sekali kalau perangkat kewalahan.
      if (!degraded && !isSmall) {
        frames++;
        slowWindow += dt;
        if (frames > 90) {
          if (slowWindow / frames > 0.026) {
            degraded = true;
            pixelRatio = Math.max(1, pixelRatio * 0.75);
            renderer.setPixelRatio(pixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight, false);
            makeTargets();
          }
          frames = 0;
          slowWindow = 0;
        }
      }
    }

    animate();

    // Baru buka tirai setelah frame pertama benar-benar tergambar.
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        document.body.classList.add('is-ready');
      });
    });

    canvas.addEventListener('webglcontextlost', function (e) {
      e.preventDefault();
      fail('Konteks WebGL terputus. Muat ulang halaman untuk melanjutkan.');
    });
  })();
  </script>
</body>
</html>
